[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-notes-mcp"
version = "0.12.0"
description = "A local MCP server for safely searching and editing personal Markdown notes"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "mitszo" }]
# FastMCP is part of the stable 1.x Python SDK API. Version 2 has a different
# low-level server API and is intentionally not adopted in this initial release.
dependencies = ["mcp>=1.26.0,<2.0.0"]

[project.scripts]
agent_notes = "agent_notes_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_notes_mcp"]
